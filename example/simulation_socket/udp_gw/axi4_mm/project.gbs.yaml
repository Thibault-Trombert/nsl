name: udp_gw_axi4_mm

root:
  name: top
  deps:
    - nsl_data.bytestream
    - nsl_simulation.driver
    - nsl_amba.axi4_mm
    - nsl_amba.axi4_stream
    - nsl_amba.apb
    - nsl_amba.ram
    - nsl_amba.stream_meta
    - nsl_amba.stream_apb
    - nsl_amba.stream_to_udp
    - nsl_amba.mm_stream_adapter
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulator
        path: tb
