name: tang_25k_spdif_sine

root:
  name: top
  deps:
    - nsl_clocking.distribution
    - nsl_clocking.pll
    - nsl_clocking.reset
    - nsl_clocking.async
    - nsl_event.tick
    - nsl_indication.activity
    - nsl_signal_generator.trigonometry
    - nsl_math.fixed
    - nsl_spdif.transceiver
    - nsl_data.bytestream
    - nsl_digilent.pmod
  sources:
    - file_type: vhdl
      files:
        - src/boundary.vhd
    - file_type: gowin-cst
      files:
        - ../pinout/clk.cst
        - ../pinout/ready_led.cst
        - ../pinout/done_led.cst
        - pinout.cst
    - file_type: gowin-sdc
      files:
        - ../pinout/clk.sdc
        - src/clocks.sdc

output:
  - name: synthesis
    topcell: boundary
    require_backends:
      - gbs.builtin.gowin
    target:
      part: GW5A-LV25MG121NC1/I0#A
      use_as_gpio:
        - sspi
        - done
        - ready
        - cpu
    outputs:
      - type: gowin-fs
        path: spdif_sine.fs
