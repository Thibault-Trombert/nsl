name: inet_vlan_path_router

root:
  name: top
  deps:
    - nsl_amba.axi4_stream
    - nsl_amba.stream_fifo
    - nsl_bnoc.committed
    - nsl_bnoc.axi_adapter
    - nsl_inet.vlan
    - nsl_inet.mac
    - nsl_mii.gmii
  sources:
    - file_type: vhdl
      files:
        - ../../../lib/nsl_inet/vlan/vlan_path_router.vhd
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl: {}
    outputs:
      - type: simulator
        path: tb
