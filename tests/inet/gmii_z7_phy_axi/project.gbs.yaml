name: inet_gmii_z7_phy_axi

root:
  name: top
  deps:
    - nsl_amba.axi4_stream
    - nsl_amba.stream_packetizer
    - nsl_mii.flit
    - nsl_mii.gmii
    - nsl_mii.gmii_axi
    - nsl_data.bytestream
    - nsl_data.text
    - nsl_simulation.assertions
    - nsl_simulation.driver
    - nsl_simulation.logging
  sources:
    - file_type: vhdl
      files:
        - src/tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    backend_config:
      gbs.builtin.ghdl:
        success_regex: "Terminating with error level: 0"
    outputs:
      - type: simulation-log
        path: simulation.log
