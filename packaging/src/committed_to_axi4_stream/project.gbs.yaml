name: committed_to_axi4_stream

root:
  name: top
  sources:
    - file_type: vhdl
      files:
        - committed_to_axi4_stream_ip_top.vhd
  deps:
    - nsl_bnoc.axi_adapter
    - nsl_amba.packer

output:
  - name: ip_package
    topcell: committed_to_axi4_stream_ip_top
    target:
      part: xc7z020clg400-1
    backend_config:
      gbs.builtin.vivado-ip:
        tool: vivado
        vendor: nsl
        library: bnoc
        name: committed_to_axi4_stream
        version: "1.0"
        taxonomy: /BNOC/Committed
        display_name: Committed to AXI4-Stream
        description: Converts a committed (framed-packet) bus to AXI4-Stream
        supported_families:
          - zynq
          - artix7
    outputs:
      - type: vivado-ip-zip
        path: committed_to_axi4_stream_1.0.zip
